<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>岁悦 · 软件物理部署图</title>
<style>
  body { margin:0; background:#f1f5f9; font-family:'Segoe UI','Microsoft YaHei',sans-serif; color:#0f172a; }
  .wrap { max-width:1280px; margin:0 auto; padding:18px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#475569; font-size:13px; margin:0 0 12px; }
  svg { width:100%; height:auto; background:#ffffff; border:1px solid #e2e8f0; border-radius:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>岁悦 · 软件物理部署图（四本体一脑 · 全离线 air-gapped）</h1>
  <p class="sub">内网 192.168.31.0/24 · 单台 4090(24GB) 承载云端大脑 · 端侧 OS 透明（RTOS / Linux / Android / NAOqi）· 公网出站全程阻断</p>

  <svg viewBox="0 0 1280 790" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
    <defs>
      <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
      </marker>
      <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/>
      </marker>
      <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>

    <!-- ===== 网络边界 ===== -->
    <rect x="40" y="70" width="890" height="600" rx="18" fill="#f7fbff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="58" y="92" fill="#1d4ed8" font-size="13" font-weight="bold">内网 LAN（air-gapped，无公网出站）</text>

    <!-- 公网列 -->
    <rect x="950" y="70" width="290" height="600" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,5"/>
    <text x="1095" y="100" text-anchor="middle" fill="#b91c1c" font-size="14" font-weight="bold">公网 Internet</text>
    <text x="1095" y="122" text-anchor="middle" fill="#b91c1c" font-size="12">— 已阻断 (air-gapped) —</text>
    <text x="1095" y="402" text-anchor="middle" fill="#dc2626" font-size="60" font-weight="bold">✕</text>
    <text x="1095" y="470" text-anchor="middle" fill="#7f1d1d" font-size="11">阶段4验收：</text>
    <text x="1095" y="488" text-anchor="middle" fill="#7f1d1d" font-size="11">默认网关→黑洞 /</text>
    <text x="1095" y="506" text-anchor="middle" fill="#7f1d1d" font-size="11">防火墙阻断全部出站</text>

    <!-- ===== 连接线（先画，盒子覆盖起点） ===== -->
    <g fill="none" stroke-width="2">
      <!-- 4090 -> 路由器 LAN -->
      <line x1="450" y1="160" x2="556" y2="143" stroke="#334155" marker-end="url(#a)"/>
      <!-- 4090 -> Otto -->
      <line x1="270" y1="320" x2="162" y2="488" stroke="#334155" marker-end="url(#a)"/>
      <!-- 4090 -> Reachy -->
      <line x1="400" y1="320" x2="366" y2="488" stroke="#334155" marker-end="url(#a)"/>
      <!-- 4090 -> Pepper 网关机 -->
      <line x1="450" y1="255" x2="450" y2="343" stroke="#334155" marker-end="url(#a)"/>
      <!-- 大亮 gateway -> 4090 -->
      <line x1="205" y1="320" x2="205" y2="343" stroke="#334155" marker-end="url(#a)"/>
      <!-- 大亮 gateway -> 大亮底盘 -->
      <line x1="340" y1="440" x2="482" y2="558" stroke="#334155" marker-end="url(#a)"/>
      <!-- Pepper 网关机 -> Pepper 本体 (本地IPC->broker) -->
      <line x1="780" y1="420" x2="762" y2="488" stroke="#7c3aed" stroke-dasharray="6,4" marker-end="url(#b)"/>
      <!-- 路由器 -> 公网 阻断 -->
      <line x1="920" y1="143" x2="948" y2="143" stroke="#dc2626" stroke-dasharray="6,4" marker-end="url(#c)"/>
    </g>
    <!-- 连线标签 -->
    <g font-size="10.5" fill="#334155">
      <text x="486" y="150">有线 LAN / NTP</text>
      <text x="196" y="430">xiaozhi WS（Opus 音频+意图）</text>
      <text x="404" y="430">xiaozhi WS</text>
      <text x="456" y="300" fill="#1d4ed8">xiaozhi WS 音频</text>
      <text x="150" y="336" fill="#1d4ed8">MCP / 小智 WS</text>
      <text x="356" y="506">WS:6060 / MQTT:1883</text>
    </g>
    <text x="792" y="402" font-size="10.5" fill="#7c3aed">本地 IPC → Py2.7 bridge → broker :9559</text>
    <text x="924" y="135" font-size="10.5" fill="#dc2626">出站→黑洞</text>

    <!-- ===== 盒子：4090 服务器 ===== -->
    <rect x="70" y="100" width="380" height="220" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="82" y="121" fill="#1e3a8a" font-size="14" font-weight="bold">4090 服务器 · 云端大脑</text>
    <text x="82" y="139" fill="#555" font-size="11">192.168.31.10 · 24GB 显存 · 本期单点</text>
    <g font-size="11" fill="#0f172a">
      <text x="82" y="160">xiaozhi-esp32-server (MIT fork) + 岁悦扩展</text>
      <text x="82" y="178">WS 接入 :8000 · OTA :8003</text>
      <text x="82" y="196">Intent Router · 场景包 elder_cn_v1</text>
      <text x="82" y="214">LLM 路由 Ollama :11434</text>
      <text x="98" y="232">· 8B 常驻(~6G) / 14B 按需(~9G)</text>
      <text x="82" y="250">ASR FunASR · TTS GPT-SoVITS</text>
      <text x="82" y="268">Emb bge-small(CPU) · 记忆 mem_local</text>
      <text x="82" y="286">能力注册表 capabilities/（含 pepper_v1）</text>
      <text x="82" y="304">常驻显存 ≈ 9.5–11GB / 24GB</text>
    </g>

    <!-- 路由器/NTP/UPS -->
    <rect x="560" y="100" width="360" height="86" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="572" y="121" fill="#3730a3" font-size="13" font-weight="bold">网络基础设施</text>
    <g font-size="11" fill="#1e1b4b">
      <text x="572" y="140">路由器：DHCP 静态绑定 / opt42 NTP</text>
      <text x="572" y="158">UPS：服务器+路由器+AP（断电续航）</text>
      <text x="572" y="176">防火墙：仅放内网段 8000/8003/11434</text>
    </g>

    <!-- 大亮 chassis-gateway -->
    <rect x="70" y="345" width="270" height="115" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="82" y="366" fill="#0e7490" font-size="12.5" font-weight="bold">大亮 chassis-gateway</text>
    <g font-size="10.5" fill="#083344">
      <text x="82" y="384">（常开 SBC / 工控机，与 4090 隔离）</text>
      <text x="82" y="404">Python · 底盘协议 ↔ MCP 工具</text>
      <text x="82" y="424">连 底盘 WS:6060 / MQTT:1883</text>
      <text x="82" y="444">心跳看门狗 → softScram</text>
    </g>

    <!-- Pepper 网关机 -->
    <rect x="450" y="345" width="330" height="115" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="462" y="366" fill="#6d28d9" font-size="12.5" font-weight="bold">Pepper 端侧网关机</text>
    <g font-size="10.5" fill="#3b0764">
      <text x="462" y="384">（实验室服务器 / 同网 SBC，与 Pepper 分离）</text>
      <text x="462" y="404">suiyue-pepper 主网关（Py3.13）</text>
      <text x="478" y="422">└ WS 连云端大脑</text>
      <text x="462" y="442">qi-bridge 子进程（Python 2.7）</text>
      <text x="478" y="460">└ qi.Session → broker :9559</text>
    </g>

    <!-- 本体：Otto -->
    <rect x="70" y="490" width="180" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="82" y="512" fill="#9a3412" font-size="13" font-weight="bold">Otto</text>
    <g font-size="10.5" fill="#431407">
      <text x="82" y="532">ESP32-S3 · RTOS</text>
      <text x="82" y="552">firmware-esp32</text>
      <text x="82" y="572">{emotion, intent}</text>
      <text x="82" y="592">→ 双足舵机动作</text>
      <text x="82" y="612">Wi-Fi → 4090:8000</text>
      <text x="82" y="630">OTA :8003</text>
    </g>

    <!-- 本体：Reachy Mini -->
    <rect x="270" y="490" width="190" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="282" y="512" fill="#9a3412" font-size="13" font-weight="bold">Reachy Mini</text>
    <g font-size="10.5" fill="#431407">
      <text x="282" y="532">树莓派5 · Linux</text>
      <text x="282" y="552">client-py 端侧全栈</text>
      <text x="282" y="572">{emotion, intent}</text>
      <text x="282" y="592">→ 头/天线/LED</text>
      <text x="282" y="612">Sherpa-ONNX 离线唤醒</text>
      <text x="282" y="630">Wi-Fi → 4090:8000</text>
    </g>

    <!-- 本体：大亮 -->
    <rect x="480" y="490" width="360" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="492" y="512" fill="#9a3412" font-size="13" font-weight="bold">大亮（双硬件本体）</text>
    <g font-size="10.5" fill="#431407">
      <text x="492" y="534">Android 上位机 · companion-app</text>
      <text x="508" y="552">（VendorSdkBridge 唯一厂商依赖）</text>
      <text x="492" y="572">EGO AGV 底盘 · L4 明文协议</text>
      <text x="492" y="592">双轮 SLAM ±2cm · 5 DOF</text>
      <text x="492" y="612">表现层经 chassis-gateway 驱动</text>
      <text x="492" y="630">geofence 禁入卧室/卫生间</text>
    </g>

    <!-- 本体：Pepper -->
    <rect x="720" y="490" width="200" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="732" y="512" fill="#9a3412" font-size="13" font-weight="bold">Pepper 本体</text>
    <g font-size="10.5" fill="#431407">
      <text x="732" y="532">x86 + NAOqi 2.5.10.7</text>
      <text x="732" y="552">20 DOF · 三轮全向</text>
      <text x="732" y="572">纯瘦客户端（无本地 LLM）</text>
      <text x="732" y="592">麦克风→云ASR / TTS→扬声器</text>
      <text x="732" y="612">禁用内置 ASR/TTS/Dialogue</text>
      <text x="732" y="630">防跌倒硬件兜底</text>
    </g>

    <!-- ===== 图例 ===== -->
    <g font-size="11">
      <rect x="40" y="700" width="16" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="62" y="713">云端大脑(4090)</text>
      <rect x="190" y="700" width="16" height="16" rx="3" fill="#eef2ff" stroke="#6366f1"/>
      <text x="212" y="713">网络基础设施</text>
      <rect x="340" y="700" width="16" height="16" rx="3" fill="#ecfeff" stroke="#0891b2"/>
      <text x="362" y="713">端侧网关(SBC)</text>
      <rect x="500" y="700" width="16" height="16" rx="3" fill="#fff7ed" stroke="#ea580c"/>
      <text x="522" y="713">机器人本体</text>
      <rect x="640" y="700" width="16" height="16" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="4,3"/>
      <text x="662" y="713">公网(阻断)</text>
      <line x1="760" y1="708" x2="800" y2="708" stroke="#334155" stroke-width="2"/>
      <text x="806" y="713">内网 xiaozhi WS / MCP</text>
      <line x1="980" y1="708" x2="1010" y2="708" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="1016" y="713">Pepper 本地 IPC→broker</text>
    </g>
    <text x="40" y="738" font-size="10.5" fill="#64748b">部署要点：chassis-gateway 与 Pepper 网关机均为「外移到常开 SBC」优先（ADR-011 §决策3），可与 4090 同机但须独立进程/容器；所有端侧 OS 对云端透明，换/加本体不改云端。</text>
  </svg>
</div>
</body>
</html>
