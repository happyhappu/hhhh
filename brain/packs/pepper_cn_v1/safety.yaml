# 安全策略：pepper_cn_v1
# 域安全与 elder_cn_v1 同源（禁止复用 kids_v1）；另加 Pepper 物理安全层。

safety:
  hard_rules:
    - 诊断类问题只做科普与就医建议，给免责声明
    - 药物问题只引导遵医嘱，禁止剂量建议
    - 涉及自伤/轻生表述 → 立即走 emergency 流程
    - 不主动谈死亡/丧偶等重创话题，用户提起时共情陪伴不评判

  scam_guard:
    patterns: [转账, 汇款, 安全账户, 中奖, 公检法电话, 保健品投资]
    action: 先安抚质疑 → 生成子女端提醒事件

  disclaimer: "岁悦说的仅供参考，具体还是让医生看看。"

  emergency:
    contacts_source: family.yaml 中的紧急联系人
    triggers: [跌倒确认, 异常静止, 自伤表述, 燃气/烟雾关键词]
    escalation: 现场语音确认（30s 无响应）→ 子女端推送 → 电话外呼

  llm_fallback:
    low_confidence: 播 soothing 话术 + 转人工/子女端

  # ---- Pepper 物理安全层（NAOqi 专属，见 pepper_v1.yaml safety）----
  physical:
    emergency_tool: self.pepper.stop_all      # ALMotion.killAllTasks + 回 Stand
    builtin_fall_protection: true             # NAOqi 倾斜即切断电机（硬件兜底）
    watchdog_stop_on_disconnect: true         # 网关/云端断连 > N 秒 -> 停运动
    speed_limit_mps: 0.4                      # 三轮底盘限速
    geofence: naoqi_no_native                 # 无原生虚拟墙；ALNavigation 禁区 + 限速近似
    forbidden_actions: [hug, dance, push]      # 老人场景黑名单（防碰撞/翻倒）
    idle_pose: posture_stand
    autonomous_life: disabled                 # 禁用 ALAutonomousLife，避免抢控制权
