# 能力注册表：pepper_v1
# Pepper = SoftBank NAOqi 人形机器人（1.2m / 三轮 / 20 自由度 / 10.1" 平板 / 4 麦 / RGB-D）。
# 本文件是 MCP-CONTRACT 的机器可读版，供云端编排器读取；端侧由 suiyue/pepper/ 的 NAOqi 网关实现。
#
# 关键定位（见 ADR-002 / ADR-011）：
#   - 机载算力弱（x86 嵌入式级），只作**纯客户端**，不本地跑 LLM → 不增加 4090 显存预算；
#   - 麦克风音频走云端 xiaozhi/FunASR；回复文本由 Pepper 本机 ALTextToSpeech 朗读；
#     网关丢弃云端二进制 TTS 音频；要完全禁用服务器端合成，服务端必须提供纯文本回复事件；
#   - 禁用 Pepper 内置 ALSpeechRecognition / ALDialog，避免本机 ASR/规则对话与云端冲突。

device_model: pepper_v1
form: mobile_humanoid_naoqi
description: 1.2m 三轮移动人形（SoftBank Pepper，NAOqi OS，20 自由度，10.1" 平板）
locomotion: naoqi_wheel            # 三轮全向底盘，max ~0.4 m/s；ALNavigation 拓扑地图导航（非 SLAM 精度）
software: suiyue-pepper            # NAOqi 桥：Python 3 主网关 + Python 2.7 qi-bridge 子进程
transport:
  dialogue: xiaozhi_websocket      # 音频/意图走小智协议（与 otto/reachy 同）
  motion: naoqi_broker             # 动作/导航/平板走 tcp://<pepper-ip>:9559 的 NAOqi broker
runtime:
  naoqi_version: "2.5.10.7"        # 当前固件；不升级到 3（Android/QiSDK/Java，缺安卓开发）
  qi_python: "2.7"                # 官方 qi Python SDK 仅支持 Py2.7
  sdk_version: "2.5.7.1"          # 已获取 pynaoqi 构建号（2.5.x 系，Py2.7，VC120）；与 2.5.10.7 固件同属 2.5 系列、代际吻合
  sdk_path: pynaoqi-python2.7-2.5.7.1-win32-vs2013/   # 工作区根，未纳入 git；运行前 lib→PYTHONPATH、bin+lib→PATH
  sdk_api: "qi (lib/qi) 或 naoqi (lib/naoqi.py·ALProxy)"  # 两套 API 同在包内
  gateway_main: python3.13        # suiyue-pepper 主网关（MCP 侧）
  qi_bridge: python2.7           # 末端 qi-bridge 子进程，连 Pepper broker :9559
  ipc: local_tcp_jsonl           # 主网关 ↔ qi-bridge 本地 IPC：TCP 127.0.0.1:9560，JSON 行（utf-8 文本）
  boot_activation_required: false # 用户已确认：Pepper 开机无需联网激活 → 无账号激活依赖
  boot_network_access: true       # ⚠️ 但开机仍会主动外连（实测 2026-10-12）：报"连接服务器失败"
  boot_config_must_disable: true  # 必做：关 boot-config 向导并持久化，否则每次开机都要 ssh 干预
  # boot-config = Getting Started Wizard（ALBehaviorManager 管理的 default behavior）。
  # 向导内含"连接 Aldebaran 社区账号 + 应用更新 + 系统升级"步骤，air-gapped 下必失败且阻塞部分功能。
  # 一次性： qicli call ALBehaviorManager.stopBehavior boot-config
  # 持久化： qicli call ALBehaviorManager.removeDefaultBehavior boot-config← 重启后不再复现
  # 验收：   重启后 isBehaviorRunning boot-config == False，且开机无报错
  # 详见 docs/部署手册-4090与Pepper联调.md §3.2.1
  channels: [audio_in, audio_out, action, screen, mobility]

naoqi:
  broker_url: tcp://192.168.31.<pepper_ip>:9559
  sdk: qi (Python 2.7 only) / naoqi Python SDK   # NAOqi 官方 qi 仅支持 Py2.7；NAOqi 2.5 培训文档实证同代 Py2.7；末端起 Py2.7 桥
  proxies_used:                  # 仅列本系统用到的；命名以 NAOqi 2.5 大学培训文档实证为准
    - ALMemory                    # 集中"内存"：传感器/事件/信号枢纽（订阅 HeadTouched 等）→ 最优先接
    - ALMotion                    # 关节/轮子运动、killAllTasks 急停、moveTo 基础移动
    - ALRobotPosture              # Stand/Sit/Crouch 等预定义姿态
    - ALAnimationPlayer           # 播放预制动画（挥手/拥抱等）
    - ALBasicAwareness            # 注视/在场（可选）
    - ALAudioRecorder             # 麦克风录音→WAV 经局域网到本地 PC（音频上云入口，见 2-3 节）
    - ALSoundLocalization         # 声源定位（可选，辅助面向说话人）
    - ALFaceDetection             # 人脸检测/识别（在场感知）
    - ALPeoplePerception          # 人体感知（计数/距离）
    - ALTracker                   # 跟踪人体（可选）
    - ALTabletService             # 平板渲染 companion Web UI
    - ALTextToSpeech              # 本机 TTS：网关发文本，Pepper 自己朗读，不下发云端合成音频
    - ALNavigation                # 拓扑地图导航【可选·降级】：培训文档导航章走 ROS(naoqi_driver)，纯 qi 路径未实证；先用 ALMotion.moveTo + 基础避障
  disabled_cloud_services:        # 离线必须关，见 ADR-011 §决策第 8 项
    - ALSpeechRecognition         # 禁用内置 ASR；改走云端 xiaozhi FunASR（培训文档语音章未用内置识别，印证）
    - ALDialog                    # 禁用 ALDialog(.top 规则引擎)；对话/意图改走云端 Intent Router
    - ALAutonomousLife            # 关键：禁用自主生命（置 disabled/nonAutonomous），否则 NAOqi 自作主张移动/交互，与云端显式控制冲突
    - 系统遥测 / 自动更新检查       # 关机箱外连 SoftBank，air-gapped 必断
    - boot-config（Getting Started Wizard）# ⚠️ 实测 2026-10-12：开机外连报"连接服务器失败"并阻塞部分功能。

  local_tts:
    enabled: true
    proxy: ALTextToSpeech
    language: Chinese
    audio_from_cloud: false
    # 关法：removeDefaultBehavior boot-config（持久）→ 见接口段 boot_config_must_disable

action_space:
  conservative_subset:            # 老人场景允许子集（其余仅展示模式）
    - wave               # 挥手打招呼
    - show_tablet        # 抬手展示平板（配合 screen 通道）
    - posture_stand      # 站立待命
    - posture_crouch     # 蹲下（把屏幕降到老人视线高度，共情交互）
    - head_nod           # 点头附和
    - head_shake         # 摇头/疑惑
  showcase_only:
    - hug
    - dance
    - push
    - tai_chi   # 以上均以 NAOqi 动画库为准

emotion_mapping:
  happy:     {motion: approach_and_wave, note: "靠近半步 + 挥手"}
  soothing:  {motion: posture_crouch,     note: "蹲下降低视线高度安抚"}
  curious:   {motion: head_tilt,         note: "偏头注视"}
  concerned: {motion: approach_and_wait, note: "走到身边停住等待对话"}
  excited:   {motion: approach_and_wave, note: "靠近并挥手"}
  neutral:   {motion: none, note: "原地站立待命"}

# 情感 → 运动意图（情感-kinesics）；纯表情由 screen/audio 通道处理。

# 云端可显式下发的动作原语 → Pepper MCP 工具（MCP-CONTRACT §7）
action_primitives:
  approach:  {tool: self.pepper.approach,      params: {marker_id}}
  navigate:  {tool: self.pepper.navigate,      params: {node, speed}}
  patrol:    {tool: self.pepper.patrol,        params: {points, loops, speed}}
  tablet:    {tool: self.pepper.tablet_render, params: {url}}
  stop:      {tool: self.pepper.stop_all,      params: {}}
  status:    {tool: self.pepper.get_status,    params: {}}

safety:
  emergency_tool: self.pepper.stop_all
  builtin_fall_protection: true     # NAOqi 机身倾斜即切断电机——比大亮多一层硬件兜底
  watchdog_stop_on_disconnect: true # 与云端/网关断连 > N 秒 → 停运动（仍须有，见 ADR-011 §决策3）
  speed_limit_mps: 0.4              # 三轮底盘常规限速（最大亦仅 ~0.4 m/s）
  geofence: naoqi_no_native         # NAOqi 无原生虚拟墙；用 ALNavigation 禁区 + 限速近似
  forbidden_actions: [hug, dance, push]   # 老人场景黑名单（防碰撞/翻倒）
  idle_pose: posture_stand

# 编排层实现（规划）：suiyue/pepper/ 网关把 self.pepper.* 翻译为 NAOqi 代理调用；
# 麦克风音频经 xiaozhi WS 上行；回复文本由 Pepper 本机 ALTextToSpeech 朗读，
# 网关忽略云端 TTS 二进制音频。服务器是否仍生成 TTS 音频取决于服务端实现/配置。
